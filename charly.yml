wl-overlay:
    candy:
        description: |
            Wayland overlay windows via gtk4-layer-shell (for screen recordings)
            Installs gtk4 + gtk4-layer-shell + PyGObject and a charly-overlay
            helper script under ~/.local/bin that draws layer-shell overlay
            windows (e.g. recording indicators). Verifiable: the helper script is
            installed and executable and the gtk4-layer-shell package is present.
        require:
            - '@github.com/opencharly/pod-dbus:v2026.274.0648'
        distro:
            arch:
                package:
                    - gtk4
                    - gtk4-layer-shell
                    - python-gobject
            fedora:
                package:
                    - gtk4
                    - gtk4-layer-shell
                    - python3-gobject
        plan:
            - run: mkdir=${HOME}/.local/bin
              mkdir: "${HOME}/.local/bin"
              run_as: "${USER}"
            - run: copy=charly-overlay
              copy: charly-overlay
              to: "${HOME}/.local/bin/charly-overlay"
              mode: "0755"
              run_as: "${USER}"
            - check: the charly-overlay helper script is installed and executable
              file:
                file: ${HOME}/.local/bin/charly-overlay
                exists: true
                mode: "0755"
            - check: the gtk4-layer-shell library package is installed
              package:
                package: gtk4-layer-shell
                installed: true

# ---------------------------------------------------------------------------
# The verb/schema skills this repo's own candy owns — routing only.
#
# Each node carries `name`/`family`/`owner` (plus `triggers:` where the skill
# generates DISPATCHER.md rows). The prose is the skill FILE at
# `<repo root>/.agents/skills/<name>/SKILL.md`, never an inline `description:`
# or `content:` — an inline body that disagrees with its file is a hard error
# in the marketplace generator. `family:` is the marketplace family the skill
# was authored under, kept so every existing `/charly-<family>:<name>` address
# still resolves; `owner:` names the candy whose command/kind surface the
# skill documents. This candy composes no image, so these nodes add nothing to
# any `ai.opencharly.skill` OCI label; the bodies reach consumers through the
# generated marketplace corpus.
# ---------------------------------------------------------------------------
wl-overlay-layer-skill:
  skill:
    name: wl-overlay-layer
    family: selkies
    owner: wl-overlay
